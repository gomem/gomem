# CI for gomem/gomem — builds and tests the Apache Arrow DataFrame library.
#
# Mirrors the local Makefile targets (make build, make test, make ci) and
# installs goimports, which the codegen step (bin/tmpl) requires to format the
# generated .gen.go files.

name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to match the go directive in go.mod (currently go 1.25).
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        # The codegen (make build) runs goimports to format generated files.
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Build (codegen + compile)
        run: make build

      - name: Test (assert)
        run: make test

      - name: Test (debug assert, CI matrix)
        run: make ci
